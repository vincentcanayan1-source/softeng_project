<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Inventory Management System</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>


  <section id="login" class="login" hidden>
    <form class="login-card" data-form="login" autocomplete="off">
      <div class="brand-mark" aria-hidden="true">IMS</div>
      <h1>Inventory Management System</h1>
      <p class="muted">Sign in to continue</p>
      <label class="field"><span>Username</span><input name="username" required autofocus></label>
      <label class="field"><span>Password</span><input name="password" type="password" required></label>
      <p class="form-err" role="alert"></p>
      <button class="btn primary block" type="submit">Sign in</button>
      <div class="demo-accounts">
        <strong>Demo accounts</strong>
        <button type="button" class="chip" data-act="fill-login" data-u="admin" data-p="admin123">admin / admin123</button>
        <button type="button" class="chip" data-act="fill-login" data-u="staff" data-p="staff123">staff / staff123</button>
        <button type="button" class="chip" data-act="fill-login" data-u="viewer" data-p="viewer123">viewer / viewer123</button>
      </div>
    </form>
  </section>

  <div id="app" class="app" hidden>
    <aside class="side" id="side">
      <div class="brand">
        <div class="brand-mark" aria-hidden="true">IMS</div>
        <div><strong>Inventory</strong><br><span class="muted small">Management System</span></div>
      </div>
      <nav id="nav" aria-label="Main"></nav>
      <div class="side-foot small muted">
        Vincent Canayan<br>BSIT-2A
      </div>
    </aside>

    <main class="main">
      <header class="top">
        <button class="btn ghost menu-btn" id="menuBtn" aria-label="Toggle menu">Menu</button>
        <h2 id="pageTitle"></h2>
        <div class="top-actions">
          <span id="who" class="small muted"></span>
          <button class="btn ghost" data-act="logout">Log out</button>
        </div>
      </header>
      <div id="view" class="view"></div>
    </main>
  </div>

  <dialog id="modal">
    <form data-form="modal" id="modalForm">
      <h3 id="modalTitle"></h3>
      <div id="modalBody" class="grid-form"></div>
      <p class="form-err" role="alert"></p>
      <div class="modal-actions">
        <button type="button" class="btn ghost" data-act="close-modal">Cancel</button>
        <button type="submit" class="btn primary">Save</button>
      </div>
    </form>
  </dialog>

  <div id="toast" class="toast" role="status" aria-live="polite"></div>

  <script src="script.js"></script>
</body>
</html>
